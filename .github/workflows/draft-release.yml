name: Draft release

# Keeps one draft release up to date with what main would release next, once
# CI has passed. Publishing the draft creates its tag, which the next draft
# counts from.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: draft-release

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Work out the next version
        id: next
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          echo "Last release: ${last:-none}"
          version=$(go run ./tools/nextrelease -since "$last" -notes notes.md)
          echo "Next release: ${version:-none needed}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create or update the draft
        if: steps.next.outputs.version != ''
        run: |
          tag="v${{ steps.next.outputs.version }}"
          draft=$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft)][0].tagName // ""')
          if [ -n "$draft" ]; then
            gh release edit "$draft" --draft --tag "$tag" --title "$tag" --target "$SHA" --notes-file notes.md
          else
            gh release create "$tag" --draft --title "$tag" --target "$SHA" --notes-file notes.md
          fi
